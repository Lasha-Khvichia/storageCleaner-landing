name: CI

# The full gate on each merge to main, or a manual run from the Actions tab:
# typecheck + lint + unit tests + production build. PRs into dev get no CI:
# run `npm run check` locally and paste the results in the PR body.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
